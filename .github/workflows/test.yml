name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        # macos は plutil -lint / bin/launchd-plist の darwin 限定テストを含む全テスト、
        # ubuntu は plutil/launchctl なしでも動くこと (環境非依存ロジック) の確認
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: node test/generator.test.js
      - run: node test/cli-lib.test.js
      - run: node test/cli-darwin.test.js
